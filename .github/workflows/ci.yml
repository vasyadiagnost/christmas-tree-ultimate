name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    name: Simulation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - run: cargo test --locked --manifest-path core/Cargo.toml

  windows:
    name: Windows sources and installer tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - run: rustup component add rustfmt
      - shell: pwsh
        run: ./scripts/verify-sources.ps1
      - run: cargo test --locked --features setup --lib --manifest-path windows/Cargo.toml -- --test-threads=1
